[package]
name = "agito-chat-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Ask a chat product one question and return the answer once the page has settled. Declares its own Page port; depends on no browser and no executor."

[lib]
name = "Driver"
path = "Source/Library.rs"

[dependencies]
agito-runtime = { workspace = true }
serde_json = { workspace = true }

# The TypeScript parser the build erases type syntax with. Build-time only:
# nothing here is linked into the binary, and no `node_modules` is involved.
[build-dependencies]
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }

[lints.rust]
non_snake_case = "allow"
non_upper_case_globals = "allow"

[lints.clippy]
upper_case_acronyms = "allow"
