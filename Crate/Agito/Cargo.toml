[package]
name = "agito"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The composition root: wiring, executable entry points, and the manifest table."

[lib]
name = "Agito"
path = "Source/Library.rs"

[[bin]]
name = "agito"
path = "Source/Main.rs"

[dependencies]
agito-runtime = { workspace = true }
agito-skill-contract = { workspace = true }
agito-chat-driver = { workspace = true }
agito-design-verification = { workspace = true }
agito-browser-cdp = { workspace = true }
agito-workflow = { workspace = true }
agito-spacetime-catalog = { workspace = true }
agito-lane = { workspace = true }
# The manifest table is the facade's, and this crate re-exports it. A root that
# owned a copy would be a second answer to "what does the workspace ship".
agito-sdk = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
# `localtime_r`, and nothing else: a note is filed by the day the person
# captured it, so its timestamp is local, and which offset a zone carries is the
# operating system's fact rather than this crate's.
libc = { workspace = true }

[lints.rust]
non_snake_case = "allow"
non_upper_case_globals = "allow"

[lints.clippy]
upper_case_acronyms = "allow"
