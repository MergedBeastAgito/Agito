[package]
name = "agentic-lane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A template corpus as data: load it, select a lane by predicate, compose a decision-model request, and return typed answers with a metered budget."

[lib]
name = "AgenticLane"
path = "Source/Library.rs"

# Three dependencies, and the short list is the claim: no HTTP client, no
# executor, no browser. The poster that reaches the endpoint is behind
# `Struct::Port::Poster`, so the round trip is testable from a fixture and the
# crate itself never opens a socket.
[dependencies]
agentic-runtime = { workspace = true }
# The request's JSON form is a derive, not a hand-built `json!` literal: three
# named fields are three keys, and a field added to the struct is a key added to
# the body. `serde_json` is the value layer the corpus and the state already
# speak; `serde` is what lets the request be written down once.
serde = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
non_snake_case = "allow"
non_upper_case_globals = "allow"

[lints.clippy]
upper_case_acronyms = "allow"

[[test]]
name = "Lane"
path = "Test/Lane.rs"

[[test]]
name = "SelectLane"
path = "Test/SelectLane.rs"

# The body's own claims - three keys, no chat field, the lane's model - kept in a
# target of their own so they stay runnable while the round trip's fixture and
# poster are being worked on.
[[test]]
name = "Request"
path = "Test/Request.rs"

# The corpus's typed model: a lane written by hand, the condition read out of it,
# and the context that condition is answered with. No file, no socket, no
# selection - the shape the loader and the selector both rest on.
[[test]]
name = "Schema"
path = "Test/Schema.rs"


# The loader alone: the layout on disk, the discovery of lane files, and the
# refusal that names the path or the id it was about. Separate from `Lane.rs`
# because these cases need corpora that are deliberately broken, and a file
# holding both a working round trip and nine refusals is a file nobody can read.
[[test]]
name = "Load"
path = "Test/Load.rs"

# The loader and the selector together, against a corpus this test builds in a
# temp directory: five lanes with mutually exclusive conditions, the typed
# questions inside their templates, the three refusals a corpus author hits, and
# the two ways a selection fails. Hermetic by construction - the suite never
# reads the real corpus, and two runs cannot share a file.
[[test]]
name = "Corpus"
path = "Test/Corpus.rs"

# The decoder alone: one body per way a reply can be wrong, and no corpus and no
# poster in sight. Separate from `Lane.rs` because a decoder that needed either
# would be testing something other than the reading - and because every case
# here is a body a transport actually hands back, not a reply this crate built.
[[test]]
name = "Decode"
path = "Test/Decode.rs"

# The shipped reply as data: the document under `Test/Fixture/Clef/`, the poster
# that answers from it, and the three things that document promises - a chosen
# option, a share for every option that sums to one, and a budget. No corpus and
# no socket: what it holds is the stand-in other runs are wired with.
[[test]]
name = "ClefFixture"
path = "Test/ClefFixture.rs"
