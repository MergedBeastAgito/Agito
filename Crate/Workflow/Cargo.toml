[package]
name = "agito-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Adapter-independent compositions, and the only place that knows both a consumer's port and the browser substrate."

[lib]
name = "Workflow"
path = "Source/Library.rs"

[dependencies]
agito-runtime = { workspace = true }
agito-chat-driver = { workspace = true }
agito-design-verification = { workspace = true }
agito-skill-contract = { workspace = true }
agito-browser-cdp = { workspace = true }
serde_json = { workspace = true }

# The TypeScript parser the build erases type syntax with - the same five
# build-only dependencies `Crate/Chat/Driver` declares, because both crates
# compile their scripts through the one shared rule in `Build/Script.rs`.
[build-dependencies]
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }

[lints.rust]
non_snake_case = "allow"
non_upper_case_globals = "allow"

[lints.clippy]
upper_case_acronyms = "allow"
