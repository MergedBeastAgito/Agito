[package]
name = "agentic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The composition root: wiring, executable entry points, and the manifest table."

[lib]
name = "Agentic"
path = "Source/Library.rs"

[[bin]]
name = "agentic"
path = "Source/Main.rs"

[dependencies]
agentic-runtime = { workspace = true }
agentic-skill-contract = { workspace = true }
agentic-chat-driver = { workspace = true }
agentic-design-verification = { workspace = true }
agentic-browser-cdp = { workspace = true }
agentic-workflow = { workspace = true }
agentic-spacetime-catalog = { workspace = true }
agentic-lane = { workspace = true }
# The manifest table is the facade's, and this crate re-exports it. A root that
# owned a copy would be a second answer to "what does the workspace ship".
agentic-sdk = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
# `localtime_r`, and nothing else: a note is filed by the day the person
# captured it, so its timestamp is local, and which offset a zone carries is the
# operating system's fact rather than this crate's.
libc = { workspace = true }

# A third-party adapter implements this crate's trait, and the composition test
# holds one as `Arc<dyn Adapter>` through the same path a consumer would take.
# The binary itself never constructs an adapter: `agentic verify` decides whether
# a manifest is well formed without running the code behind it.
[dev-dependencies]
agentic-adapter = { workspace = true }

[lints.rust]
non_snake_case = "allow"
non_upper_case_globals = "allow"

[lints.clippy]
upper_case_acronyms = "allow"

[[test]]
name = "Boundaries"
path = "Test/Boundaries.rs"

[[test]]
name = "Composition"
path = "Test/Composition.rs"

[[test]]
name = "Extract"
path = "Test/Extract.rs"

[[test]]
name = "Legend"
path = "Test/Legend.rs"

[[test]]
name = "Note"
path = "Test/Note.rs"

# The one test that reads a corpus this workspace did not write. It sits here
# rather than beside `Crate/Lane` because the corpus's vocabulary is a game's,
# and `Crate/Lane/Test/Lane.rs` states that a game name inside the crate would
# be the crate claiming a caller it does not have.
[[test]]
name = "CorpusLanes"
path = "Test/CorpusLanes.rs"

# The same corpus, decided end to end: the lane each case selects, the request
# it composes and the typed answer a canned reply returns, one document per
# template under `Test/Fixture/CorpusDecide/`. A target of its own because it is
# the only one that joins the real corpus to the poster, and a corpus or a
# fixture edited into something the pipeline cannot read should fail a suite
# named after that join rather than an assertion inside another one.
[[test]]
name = "CorpusDecide"
path = "Test/CorpusDecide.rs"
