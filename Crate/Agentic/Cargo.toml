[package]
name = "agentic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The composition root: wiring, executable entry points, and the manifest table."

[lib]
name = "Agentic"
path = "Source/Library.rs"

[[bin]]
name = "agentic"
path = "Source/Main.rs"

[dependencies]
agentic-runtime = { workspace = true }
agentic-skill-contract = { workspace = true }
agentic-chat-driver = { workspace = true }
agentic-design-verification = { workspace = true }
agentic-browser-cdp = { workspace = true }
agentic-workflow = { workspace = true }
agentic-spacetime-catalog = { workspace = true }
agentic-lane = { workspace = true }
# The manifest table is the facade's, and this crate re-exports it. A root that
# owned a copy would be a second answer to "what does the workspace ship".
agentic-sdk = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
# `localtime_r`, and nothing else: a note is filed by the day the person
# captured it, so its timestamp is local, and which offset a zone carries is the
# operating system's fact rather than this crate's.
libc = { workspace = true }

# A third-party adapter implements this crate's trait, and the composition test
# holds one as `Arc<dyn Adapter>` through the same path a consumer would take.
# The binary itself never constructs an adapter: `agentic verify` decides whether
# a manifest is well formed without running the code behind it.
[dev-dependencies]
agentic-adapter = { workspace = true }

[lints.rust]
non_snake_case = "allow"
non_upper_case_globals = "allow"

[lints.clippy]
upper_case_acronyms = "allow"

[[test]]
name = "Boundaries"
path = "Test/Boundaries.rs"

[[test]]
name = "Composition"
path = "Test/Composition.rs"

[[test]]
name = "Extract"
path = "Test/Extract.rs"

[[test]]
name = "Legend"
path = "Test/Legend.rs"

[[test]]
name = "Note"
path = "Test/Note.rs"
