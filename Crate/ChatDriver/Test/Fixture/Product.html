<!doctype html>
<!--
	A chat product's shape, as a fixture.

	It is not a product: there is no network here, no login, no model and no
	answer worth reading. It exists so `agentic chat` can be run end to end -
	composer, mode toggle, model label, send control, an answer that settles -
	without typing into somebody's real thread:

	    Target/debug/agentic chat \
	        --url file://$PWD/Crate/ChatDriver/Test/Fixture/Product.html \
	        --model fixture-model \
	        --question 'What is the closed form of a quadratic?' \
	        --format both --thread fixture-thread --observe --timeout 30000

	The answer carries the same formula markup as `Answer.html`, twice: the
	annotation KaTeX was built from, and the glyph run it renders. That is what
	makes the pair reading visible in a terminal - `text` comes back with the
	glyphs and `markdown` with the TeX, from one evaluate of this page.

	Every selector the driver's defaults name is here, so nothing about the run
	is configured for it: `[data-command-menu-control] button` with
	`aria-pressed`, a model button with `aria-haspopup`, a `textarea`, a send
	control, and `.prose[data-renderer='lm']` for the answer.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Fixture product</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				margin: 2rem auto;
				max-width: 48rem;
			}
			.composer-row {
				align-items: center;
				display: flex;
				gap: 1rem;
				margin-bottom: 1rem;
			}
			[data-command-menu-control] button[aria-pressed="false"] {
				opacity: 0.5;
			}
			textarea {
				font: inherit;
				min-height: 4rem;
				width: 100%;
			}
			table {
				border-collapse: collapse;
			}
			td,
			th {
				border: 1px solid #ccc;
				padding: 0.25rem 0.5rem;
			}
		</style>
	</head>
	<body>
		<div class="composer-row">
			<span data-command-menu-control>
				<button aria-pressed="true">Search</button>
				<button aria-pressed="false">Computer</button>
			</span>
			<button aria-haspopup="listbox">fixture-model</button>
		</div>
		<div id="thread"></div>
		<form id="composer">
			<textarea id="input" aria-label="Ask anything"></textarea>
			<button type="submit" data-testid="submit-button" disabled>Send</button>
		</form>
		<script>
			const Input = document.getElementById("input");
			const Submit = document.querySelector("[data-testid='submit-button']");
			const Thread = document.getElementById("thread");

			Input.addEventListener("input", () => {
				Submit.disabled = Input.value.trim() === "";
			});

			// The answer the product would produce. It is added on submit and
			// never changes again, which is what lets the driver settle on it.
			const Answer = () => {
				const Article = document.createElement("article");
				Article.className = "prose";
				Article.dataset.renderer = "lm";
				Article.innerHTML = `
					<h2>What the fixture says</h2>
					<p>
						Energy and mass are the same fact, written
						<span class="katex">
							<span class="katex-mathml">
								<math>
									<semantics>
										<mrow
											><mi>E</mi><mo>=</mo><mi>m</mi
											><msup><mi>c</mi><mn>2</mn></msup></mrow
										>
										<annotation encoding="application/x-tex">E = mc^2</annotation>
									</semantics>
								</math>
							</span>
							<span class="katex-html" aria-hidden="true">
								<span class="mord mathnormal">E</span><span class="mspace"></span
								><span class="mrel">=</span><span class="mspace"></span
								><span class="mord mathnormal">m</span
								><span class="mord"
									><span class="mord mathnormal">c</span
									><span class="msupsub"><span class="mord">2</span></span></span
								>
							</span>
						</span>
						twice over, and the second form is the one worth reading.
					</p>
					<p>Three terms, one row per term:</p>
					<table>
						<thead>
							<tr><th>Entity</th><th>Definition</th></tr>
						</thead>
						<tbody>
							<tr><td>Task</td><td>Versioned intent</td></tr>
							<tr><td>Trial</td><td>One execution</td></tr>
						</tbody>
					</table>
					<p>Read the <a href="https://example.test/source">source</a> before the answer.</p>
				`;
				return Article;
			};

			document.getElementById("composer").addEventListener("submit", (Event) => {
				Event.preventDefault();
				Thread.append(Answer());
				Input.value = "";
				Submit.disabled = true;
			});
		</script>
	</body>
</html>
