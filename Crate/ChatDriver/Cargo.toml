[package]
name = "agentic-chat-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Ask a chat product one question and return the answer once the page has settled. Declares its own Page port; depends on no browser and no executor."

[lib]
name = "AgenticChatDriver"
path = "Source/Library.rs"

[dependencies]
agentic-runtime = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
non_snake_case = "allow"
non_upper_case_globals = "allow"

[lints.clippy]
upper_case_acronyms = "allow"

[[test]]
name = "Chat"
path = "Test/Chat.rs"

[[test]]
name = "Parity"
path = "Test/Parity.rs"
