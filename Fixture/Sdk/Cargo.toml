[package]
name = "agentic-sdk-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "A consumer that depends on `agentic-sdk` and on no other crate of this workspace."

# Its own workspace root, and deliberately not a member of the tree under
# `Crate/`: the claim this crate exists to check is that a consumer reaches the
# surface through the facade. A member would resolve its siblings through the
# workspace's own graph, which is exactly the thing a consumer cannot do.
[workspace]

[dependencies]
agentic-sdk = { path = "../../Crate/Sdk" }

# The executor, and the only other dependency. `agentic.browse` spawns the
# handler that keeps a page answering, so its launcher requires a tokio runtime -
# a fact the adapter states and this fixture therefore has to satisfy. Nothing
# here is an Agentic crate.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[[bin]]
name = "agentic-sdk-fixture"
path = "Source/Main.rs"

# The house style is PascalCase everywhere: locals, fields and modules. These
# three lints are the only ones that disagree with it, and a fixture that
# silently wrote snake_case would not look like the consumer it stands in for.
[lints.rust]
non_snake_case = "allow"
non_upper_case_globals = "allow"

[lints.clippy]
upper_case_acronyms = "allow"
