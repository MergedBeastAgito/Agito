[workspace]
resolver = "3"
members = ["Crate/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
# The repository ships one licence, so this field agrees with it: `LICENSE` is
# CC0 1.0 Universal. A crate cannot claim a licence the tree does not carry.
license = "CC0-1.0"
# Publishing is disabled at the root and inherited by every member (each crate
# carries `publish.workspace = true`). The crates.io namespace is not ours yet,
# so a stray `cargo publish` from any crate must fail here rather than depend on
# a workflow remembering not to run it.
publish = false

[workspace.dependencies]
# A path dependency carries a version beside its path, and that version must
# track `[workspace.package] version` above: `cargo package` - which the release
# workflow runs so the `.crate` files ship without a registry - refuses a path
# dependency that names no version. Nothing here is published to crates.io;
# `publish = false` above sees to that.
agentic-runtime = { version = "0.1.3", path = "Crate/Runtime" }
agentic-skill-contract = { version = "0.1.3", path = "Crate/SkillContract" }
agentic-chat-driver = { version = "0.1.3", path = "Crate/ChatDriver" }
agentic-browser-cdp = { version = "0.1.3", path = "Crate/BrowserCDP" }
agentic-design-verification = { version = "0.1.3", path = "Crate/DesignVerification" }
agentic-workflow = { version = "0.1.3", path = "Crate/Workflow" }
agentic-spacetime-catalog = { version = "0.1.3", path = "Crate/SpacetimeCatalog" }
# The port shape a substrate this workspace did not write implements. It depends
# on the runtime and nothing else, and nothing in the tree depends on it except
# a third party's adapter: that is what makes `kind: "adapter"` a claim about
# somebody else's crate rather than about one of ours.
agentic-adapter = { version = "0.1.3", path = "Crate/Adapter" }
# The facade. It depends on the five crates a consumer would otherwise name, and
# the composition root depends on it for the manifest table - so the arrow runs
# from the root down through the facade to the ports, never the other way.
agentic-sdk = { version = "0.1.3", path = "Crate/Sdk" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

# Build-time only: the TypeScript parser a crate's `build.rs` erases type
# syntax with. Pinned exactly, because the erasure walks this parser's AST and
# a minor release that renames a node must be a deliberate upgrade rather than
# a broken build. Nothing at run time links any of these.
oxc_allocator = "=0.157.0"
oxc_ast = "=0.157.0"
oxc_ast_visit = "=0.157.0"
oxc_parser = "=0.157.0"
oxc_span = "=0.157.0"
tokio = { version = "1.54.1", features = [
	"rt",
	"rt-multi-thread",
	"time",
	"sync",
	"macros",
] }
tokio-util = "0.7.20"
futures-util = "0.3.34"
chromiumoxide = "0.9.1"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
lto = true
panic = "abort"
strip = true
