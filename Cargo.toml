[workspace]
resolver = "3"
members = ["Crate/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
# The repository ships one licence, so this field agrees with it: `LICENSE` is
# CC0 1.0 Universal. A crate cannot claim a licence the tree does not carry.
license = "CC0-1.0"

[workspace.dependencies]
agentic-runtime = { path = "Crate/Runtime" }
agentic-skill-contract = { path = "Crate/SkillContract" }
agentic-chat-driver = { path = "Crate/ChatDriver" }
agentic-browser-cdp = { path = "Crate/BrowserCDP" }
agentic-design-verification = { path = "Crate/DesignVerification" }
agentic-workflow = { path = "Crate/Workflow" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = [
	"rt",
	"rt-multi-thread",
	"time",
	"sync",
	"macros",
] }
tokio-util = "0.7.20"
futures-util = "0.3.34"
chromiumoxide = "0.9.1"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
lto = true
panic = "abort"
strip = true
