# Build - the only distribution channel this repository has.
#
# `agito` is not published to crates.io, so a file this workflow does not
# build and attach does not exist for anyone. There is no manual upload step and
# no documented fallback: if a file cannot be attached, the release fails rather
# than looking complete.
#
# The shape is the house pattern (Aphrodite's `Build.yml`): `Release` creates the
# release exactly once before any matrix leg runs, each `Build` leg attaches only
# its own files, and `Finalize` runs once afterwards - it packages what is not a
# per-platform binary, merges the checksums and attaches them.
#
# This file is the ONLY workflow that reacts to `Agito/v*`. A second workflow
# on the same tag would race to create the same release and clobber the same
# `SHA256SUMS.txt`, so the tag has exactly one owner by construction.
name: Build

concurrency:
  # A tag is immutable, so the only way two runs of this workflow share a ref is
  # a `workflow_dispatch` re-run - and cancelling the older dry run is the point
  # of a dry run. A release that is already attaching assets is never displaced
  # by a different ref.
  group: Build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags: ["Agito/v*"]

env:
  CARGO_TERM_COLOR: always
  DO_NOT_TRACK: 1

  # The five targets this release ships, written into the release body.
  # Declared here rather than generated from the matrix so the body states what
  # the release is meant to contain, whatever the matrix happens to run.
  EXPECTED_TARGETS: >-
    x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin
    x86_64-pc-windows-msvc

jobs:
  Release:
    name: Release
    # A dispatch has no tag to hang a release on, so this job skips and the
    # matrix still runs: a pipeline that cannot be dry-run is a pipeline nobody
    # exercises before the tag that matters.
    if: startsWith(github.ref, 'refs/tags/Agito/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag names the version, and the manifest has to agree with it: a
      # release whose tag says 0.1.0 while the binary reports 0.1.1 is a release
      # nobody can name. Checked before the release exists, not after.
      - name: Guard the tag
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            Agito/v[0-9]*) ;;
            *)
              echo "::error::'${GITHUB_REF_NAME}' is not a release tag of the form Agito/v<semver>"
              exit 1
              ;;
          esac
          Version="${GITHUB_REF_NAME#Agito/v}"
          # Scoped to `[workspace.package]`, not `grep -m1 '^version ='`. The
          # latter reads whichever `version` key comes first in the file, so a
          # new table above `[workspace.package]` would silently release the
          # wrong number. This stops at the first version line inside the table
          # and nowhere else.
          ManifestVersion="$(
            awk '
              /^\[/ { InSection = ($0 ~ /^\[workspace\.package\]$/) ; next }
              InSection && /^version[[:space:]]*=/ {
                Line = $0
                sub(/^[^"]*"/, "", Line)
                sub(/".*$/, "", Line)
                print Line
                exit
              }
            ' Cargo.toml
          )"
          if [ -z "${ManifestVersion}" ]; then
            echo "::error::could not read a version from [workspace.package] in Cargo.toml"
            exit 1
          fi
          if [ "${Version}" != "${ManifestVersion}" ]; then
            echo "::error::tag says ${Version} but [workspace.package] version is ${ManifestVersion}"
            exit 1
          fi
          {
            echo "TAG=${GITHUB_REF_NAME}"
            echo "VERSION=${Version}"
          } >> "${GITHUB_ENV}"
          echo "releasing agito ${Version} from ${GITHUB_REF_NAME}"

      # The body is written by this step, not typed by hand, and it is rewritten
      # on every run: it names the commit, the targets and where the checksums
      # are, so it cannot drift from what was actually built.
      - name: Write the release body
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # A QUOTED heredoc: the backticks below are Markdown code spans, and
          # quoting the delimiter is what stops the shell reading them as command
          # substitution. The `@NAME@` tokens are filled in afterwards with bash
          # parameter expansion - no `sed`, so nothing here can rewrite a line it
          # did not mean to.
          Body="$(cat <<'BODY'
          ## agito @VERSION@

          Built by `.github/workflows/Build.yml` from commit `@SHA@` on tag `@TAG@`.
          Every asset below was built, hashed and attached by that workflow - nothing is uploaded by hand.

          ### Targets built

          @TARGETS@
          The Linux targets are musl, so the binaries are static; the macOS targets are built
          on an arm64 runner and the Intel leg is a `--target` cross build.
          Each archive holds the `agito` binary with `LICENSE` and `README.md`.

          ### Checksums

          - **`SHA256SUMS.txt`** - one merged list over every file attached to this release.
          - **`SHA256SUMS-<target>.txt`** - the per-target list, beside its archive.

          Verify from a directory holding the downloaded assets:

          ```sh
          sha256sum -c SHA256SUMS.txt      # Linux
          shasum -a 256 -c SHA256SUMS.txt  # macOS
          ```

          ### Not on crates.io

          `agito` is not published to a registry, so the source ships here too:

          - **`agito-@VERSION@-source.tar.gz`** - the tagged tree, which is what actually builds.
          - **`agito-@VERSION@-vendor.tar.gz`** - `cargo vendor` output plus `vendor-config.toml`, so the tree builds offline.
          - **`<crate>-@VERSION@.crate`** - one per workspace crate, the `cargo package` output for that crate.
          - **`agito-skills-@VERSION@.tar.gz`** - `Documentation/Skill`, the corpus the binary validates.

          The `.crate` files are one crate at a time. `Crate/Chat/Driver` and `Crate/Workflow`
          compile their scripts through a shared `Build/Script.rs` that sits above them in the
          tree, so build those two from the source tarball rather than from their `.crate`.

          The archives are unsigned but hashed. Signing and notarisation are a separate decision.
          BODY
          )"

          # The per-target list is generated from the independent target
          # declaration rather than from the matrix. Bold here and code spans in
          # the heredoc above: a backtick inside a single-quoted format string is
          # exactly what SC2016 flags, and this is the one part of the body the
          # shell has to build.
          Targets=""
          for Target in ${EXPECTED_TARGETS}; do
            case "${Target}" in
              *windows*) Extension=zip ;;
              *) Extension=tar.gz ;;
            esac
            Targets="${Targets}- **${Target}** - **agito-${VERSION}-${Target}.${Extension}**"$'\n'
          done

          Body="${Body//@TARGETS@/${Targets}}"
          Body="${Body//@VERSION@/${VERSION}}"
          Body="${Body//@SHA@/${GITHUB_SHA}}"
          Body="${Body//@TAG@/${TAG}}"
          printf '%s\n' "${Body}" > dist/ReleaseBody.md
          cat dist/ReleaseBody.md

      # Created exactly once, before any matrix leg attaches a file, so five
      # concurrent uploads do not race to create it. `body_path` is what ships;
      # `generate_release_notes` is kept because the house shape names it, and
      # the REST API gives an explicit body precedence.
      - name: Create the release (draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: dist/ReleaseBody.md
          generate_release_notes: true
          draft: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Build:
    name: Build ${{ matrix.target }}
    needs: Release
    if: always() && (needs.Release.result == 'success' || needs.Release.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg finishes and attaches its own archive even when a sibling leg is
      # slow or red - Windows is the long pole. `Finalize` then fails loudly on an
      # incomplete matrix, so a partial upload is caught instead of shipped.
      fail-fast: false
      matrix:
        include:
          # Linux ships musl, not gnu: the release is static, and a gnu binary
          # binds whatever glibc the runner happened to have.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
          # Cross-compiled from arm64. macos-13 (a real Intel host) queues
          # indefinitely on GitHub-hosted runners; `--target` alone is enough.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the musl toolchains
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Setup Rust (nightly, latest)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}

      # rustc ships its own musl libc for musl targets, so the cross gcc only has
      # to be the linker driver - but it has to be told, or the build reaches for
      # a host `cc` that cannot emit aarch64 objects.
      - name: Point the aarch64-musl linker at the cross gcc
        if: ${{ matrix.target == 'aarch64-unknown-linux-musl' }}
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "${GITHUB_ENV}"
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> "${GITHUB_ENV}"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            Target/
          key: cargo-build-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-build-${{ runner.os }}-${{ matrix.target }}-

      # No `--locked`: the lock file is local-only by policy and a runner's
      # checkout has none. The tag pins the source; the graph is resolved here.
      - name: Build
        shell: bash
        run: cargo build --release -p agito --target ${{ matrix.target }}

      # A tag names the version; a dispatch has to read it out of the manifest, so
      # the dry run exercises the same packaging path with the same name shape.
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            Version="${GITHUB_REF_NAME#Agito/v}"
          else
            # Ask cargo rather than grepping the manifest: the version lives in
            # `[workspace.package]`, and a text search would read whichever
            # `version` key came first. This is the version of the package that
            # was just built, which is the one the archive is named after.
            Version="$(cargo metadata --no-deps --offline --format-version 1 \
              | jq -r '.packages[] | select(.name == "agito") | .version')"
            if [ -z "${Version}" ]; then
              echo "::error::cargo metadata reported no version for the agito package"
              exit 1
            fi
          fi
          echo "version=${Version}" >> "${GITHUB_OUTPUT}"
          echo "packaging agito ${Version} for ${{ matrix.target }}"

      - name: Package (Unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        env:
          Version: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          Target="${{ matrix.target }}"
          Name="agito-${Version}-${Target}"
          cp "Target/${Target}/release/agito" agito
          tar czf "${Name}.tar.gz" agito LICENSE README.md
          ls -lh "${Name}.tar.gz"
          tar tzf "${Name}.tar.gz"

      # PowerShell rather than Git Bash: MSYS rewrites a single-slash argument
      # into a filesystem path, which is the class of bug that silently produced
      # broken Windows assets in the reference pipeline.
      - name: Package (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        env:
          Version: ${{ steps.version.outputs.version }}
        run: |
          $Target = "${{ matrix.target }}"
          $Name = "agito-$env:Version-$Target"
          Copy-Item "Target/$Target/release/agito.exe" "agito.exe"
          Compress-Archive -Path "agito.exe", "LICENSE", "README.md" -DestinationPath "$Name.zip" -CompressionLevel Optimal
          Get-ChildItem "$Name.zip"

      # Windows hashes with `Get-FileHash`, not bash + `certutil`/`findstr`: Git
      # Bash's MSYS path-conversion layer turns a single-slash flag like
      # `findstr /v` into a filesystem path, so the hash step silently breaks.
      # The list is written with LF endings and no BOM so `sha256sum -c` on Linux
      # (which is where `Finalize` cross-checks it) reads it verbatim.
      - name: Checksum (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        env:
          Version: ${{ steps.version.outputs.version }}
        run: |
          $Target = "${{ matrix.target }}"
          $File = "agito-$env:Version-$Target.zip"
          $Hash = (Get-FileHash $File -Algorithm SHA256).Hash.ToLower()
          $Line = "$Hash  $File`n"
          [IO.File]::WriteAllText("SHA256SUMS-$Target.txt", $Line, [Text.UTF8Encoding]::new($false))
          Get-Content "SHA256SUMS-$Target.txt"

      - name: Checksum (Unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        env:
          Version: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          Target="${{ matrix.target }}"
          File="agito-${Version}-${Target}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${File}" > "SHA256SUMS-${Target}.txt"
          else
            shasum -a 256 "${File}" > "SHA256SUMS-${Target}.txt"
          fi
          cat "SHA256SUMS-${Target}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agito-${{ matrix.target }}
          path: |
            agito-*.*
            SHA256SUMS-${{ matrix.target }}.txt
          if-no-files-found: error

      # The Release job already created the draft; each leg attaches only its own
      # archive and its own checksum list here. `gh release upload` rather than
      # the release action, because an action call that carries no `draft` input
      # is one edit away from publishing the release before the assets are on
      # it. `agito-*.*` cannot match the bare `agito.exe` the Windows leg
      # stages - the hyphen is what keeps the binary out of the asset list.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/Agito/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          Version: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          Target="${{ matrix.target }}"
          case "${Target}" in
            *windows*) Archive="agito-${Version}-${Target}.zip" ;;
            *) Archive="agito-${Version}-${Target}.tar.gz" ;;
          esac
          for File in "${Archive}" "SHA256SUMS-${Target}.txt"; do
            if [ ! -f "${File}" ]; then
              echo "::error::${File} was never produced - refusing to attach a partial leg"
              exit 1
            fi
          done
          gh release upload "${GITHUB_REF_NAME}" "${Archive}" "SHA256SUMS-${Target}.txt" --clobber

  # Runs once, after every leg has finished. It packages what is not a
  # per-platform binary and attaches it to the draft.
  Finalize:
    name: Finalize release assets
    needs: [Build]
    # A dispatch has no release to finalize, so it stops after the dry run.
    if: startsWith(github.ref, 'refs/tags/Agito/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "TAG=${GITHUB_REF_NAME}"
            echo "VERSION=${GITHUB_REF_NAME#Agito/v}"
          } >> "${GITHUB_ENV}"

      - name: Download every leg's artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agito-*
          path: dist
          merge-multiple: true

      - name: Setup Rust (nightly, latest)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly

      # The crate set is declared from `cargo metadata` - the workspace's own
      # answer - and written to a file that packaging and attaching both read.
      # Deriving the set from `dist/*.crate` instead would make "whatever
      # packaging managed to produce" the definition of what ships.
      #
      # Runs before anything is packaged, so the declaration cannot be
      # influenced by packaging output.
      - name: Declare the expected crates
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --offline --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version) \(.manifest_path)"' \
            | LC_ALL=C sort > "${RUNNER_TEMP}/crates.txt"
          if [ ! -s "${RUNNER_TEMP}/crates.txt" ]; then
            echo "::error::cargo metadata reported no packages"
            exit 1
          fi
          cat "${RUNNER_TEMP}/crates.txt"
          # Every member must carry the version the tag names: a member left
          # behind at the previous version ships a `.crate` that cannot resolve
          # its siblings from this release.
          awk -v Want="${VERSION}" '
            $2 != Want { printf "::error::%s is %s but the release is %s\n", $1, $2, Want ; Bad = 1 }
            END { exit(Bad ? 1 : 0) }
          ' "${RUNNER_TEMP}/crates.txt"
          awk -v Want="${VERSION}" '{ print $1 "-" Want ".crate" }' \
            "${RUNNER_TEMP}/crates.txt" > "${RUNNER_TEMP}/expected-crates.txt"
          cat "${RUNNER_TEMP}/expected-crates.txt"
          # A word list for the read-back step, which compares names rather than
          # iterating a file. The file stays the source; this is a copy of it.
          echo "EXPECTED_CRATES=$(tr '\n' ' ' < "${RUNNER_TEMP}/expected-crates.txt")" >> "${GITHUB_ENV}"

      # Not on crates.io: the `.crate` files are how a consumer gets one crate's
      # packaged source without a registry. Two things stand between this tree
      # and a `.crate`, and both are answered here rather than by publishing:
      #
      # - `cargo package` strips every `path` dependency and resolves the version
      #   from the registry, so an unpublished sibling cannot be found. A patch
      #   table generated from the workspace itself stands in for the registry;
      #   absolute paths because a `--config` file resolves relative ones against
      #   its own location, not the workspace root.
      # - It refuses a path dependency that names no version, which is why
      #   `[workspace.dependencies]` carries a version beside each path.
      #
      # `--no-verify` because the tree was already built per target above;
      # `--allow-dirty` because packaging writes build output the next package
      # then sees. No `--locked`: the lock file is local-only by policy.
      - name: Package every crate
        shell: bash
        run: |
          set -euo pipefail
          Patch="${RUNNER_TEMP}/package-patch.toml"
          {
            echo '[patch.crates-io]'
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | "\(.name) = { path = \"\(.manifest_path | sub("/Cargo.toml$"; ""))\" }"'
          } > "${Patch}"
          cat "${Patch}"
          # `Target/package` holds a previous run's crates whenever the build
          # directory survived - a restored cache, a local rehearsal. A bare
          # `cp Target/package/*.crate` would then attach a second version's
          # crates beside this one's, so the directory starts empty and only the
          # declared names are copied out.
          rm -rf Target/package
          awk '{ print $3 }' "${RUNNER_TEMP}/crates.txt" | while IFS= read -r Manifest; do
            echo "::group::cargo package ${Manifest}"
            cargo --config "${Patch}" package --no-verify --allow-dirty \
              --manifest-path "${Manifest}"
            echo "::endgroup::"
          done
          Missing=0
          while IFS= read -r Crate; do
            if [ -f "Target/package/${Crate}" ]; then
              cp "Target/package/${Crate}" dist/
            else
              echo "::error::cargo package produced no ${Crate}"
              Missing=1
            fi
          done < "${RUNNER_TEMP}/expected-crates.txt"
          if [ "${Missing}" -ne 0 ]; then
            exit 1
          fi
          ls -l dist/*.crate

      # The offline path: `cargo vendor` plus the source-replacement block it
      # prints, so `vendor-config.toml` can be appended to `.cargo/config.toml`.
      - name: Vendor the dependencies
        shell: bash
        run: |
          set -euo pipefail
          Root="$(mktemp -d)"
          cargo vendor "${Root}/vendor" > "${Root}/vendor-config.toml"
          cat "${Root}/vendor-config.toml"
          tar -czf "dist/agito-${VERSION}-vendor.tar.gz" -C "${Root}" vendor vendor-config.toml
          ls -l "dist/agito-${VERSION}-vendor.tar.gz"

      # The tagged tree itself. The `.crate` files are per-crate package output;
      # this is the only asset that unpacks into something `cargo build`
      # can run, which is why it travels beside them.
      - name: Package the source tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="agito-${VERSION}/" \
            -o "dist/agito-${VERSION}-source.tar.gz" "${GITHUB_SHA}"
          # Listed into a file, then head reads the file. `tar ... | head` dies
          # with `tar: stdout: write error` when head closes the pipe, and
          # `pipefail` turns that into a failed release.
          tar tzf "dist/agito-${VERSION}-source.tar.gz" > "${RUNNER_TEMP}/source-list.txt"
          head -20 "${RUNNER_TEMP}/source-list.txt"
          ls -l "dist/agito-${VERSION}-source.tar.gz"

      # The skill corpus is part of what this repository ships, so it travels
      # with the binary that validates it. It unpacks to `Documentation/Skill`.
      - name: Package the skill corpus
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/agito-skills-${VERSION}.tar.gz" -C . Documentation/Skill
          tar tzf "dist/agito-skills-${VERSION}.tar.gz" > "${RUNNER_TEMP}/skills-list.txt"
          head -20 "${RUNNER_TEMP}/skills-list.txt"
          ls -l "dist/agito-skills-${VERSION}.tar.gz"

      # One list over every file that will be attached - the per-target lists
      # included, since they are attached files too. Hashed from the bytes in
      # `dist/`, which are the bytes that go up.
      - name: Merge the checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          {
            printf '# agito %s - every file attached to the %s release.\n' "${VERSION}" "${TAG}"
            printf '# Generated by .github/workflows/Build.yml from commit %s - do not edit.\n' "${GITHUB_SHA}"
            printf '# Verify with: sha256sum -c SHA256SUMS.txt\n'
          } > SHA256SUMS.txt
          shopt -s nullglob
          Files=()
          for File in *; do
            [ "${File}" = "SHA256SUMS.txt" ] && continue
            [ -f "${File}" ] || continue
            Files+=("${File}")
          done
          printf '%s\n' "${Files[@]}" | LC_ALL=C sort > "${RUNNER_TEMP}/merged-files.txt"
          while IFS= read -r File; do
            sha256sum "${File}"
          done < "${RUNNER_TEMP}/merged-files.txt" >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          Entries="$(grep -cv '^#' SHA256SUMS.txt || true)"
          Count="$(wc -l < "${RUNNER_TEMP}/merged-files.txt")"
          if [ "${Entries}" -ne "${Count}" ]; then
            echo "::error::SHA256SUMS.txt has ${Entries} entries for ${Count} attached files"
            exit 1
          fi

      - name: Attach the packaging assets and the merged checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          Files=()
          Missing=0
          # One `.crate` per crate the workspace declares - by name, from the
          # declaration written before packaging ran. A glob here would match
          # whatever happened to be in `dist/`, which is exactly the set this
          # step is supposed to be checking rather than trusting.
          while IFS= read -r Crate; do
            if [ -f "dist/${Crate}" ]; then
              Files+=("dist/${Crate}")
            else
              echo "::error::missing packaging asset: ${Crate}"
              Missing=1
            fi
          done < "${RUNNER_TEMP}/expected-crates.txt"
          for File in \
            "agito-${VERSION}-source.tar.gz" \
            "agito-${VERSION}-vendor.tar.gz" \
            "agito-skills-${VERSION}.tar.gz" \
            "SHA256SUMS.txt"; do
            if [ -f "dist/${File}" ]; then
              Files+=("dist/${File}")
            else
              echo "::error::missing packaging asset: ${File}"
              Missing=1
            fi
          done
          if [ "${Missing}" -ne 0 ]; then
            exit 1
          fi
          Declared=$(( $(wc -l < "${RUNNER_TEMP}/expected-crates.txt") + 4 ))
          if [ "${#Files[@]}" -ne "${Declared}" ]; then
            echo "::error::declared ${Declared} packaging assets, collected ${#Files[@]}"
            exit 1
          fi
          printf '%s\n' "${Files[@]}"
          gh release upload "${TAG}" "${Files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber

      # Publishing is the last act, not the first: this repository's releases are
      # immutable, so a release published before its assets are attached can
      # never receive them. Everything above landed on a draft; this is the one
      # step that makes the set final.
      - name: Publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IsDraft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
          if [ "${IsDraft}" = "true" ]; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
            echo "published ${TAG}"
          else
            echo "${TAG} is already published - leaving it alone"
          fi
