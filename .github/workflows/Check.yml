name: Check

# One job per concern: a formatting slip, a clippy lint and a failing test are
# three different answers, and a single job stops at the first one and hides the
# other two behind it. Five jobs also means five caches, so a re-push re-uses
# the compiled dependencies of the job it is actually waiting on.
concurrency:
  group: Check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DO_NOT_TRACK: 1

jobs:
  Check:
    name: cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stable, not nightly: `rust-version = "1.88"` in the workspace manifest
      # is a promise the tree builds on stable, and a gate that needs nightly to
      # honour it is not checking that promise. The one exception is the format
      # job below, whose formatter options only exist on nightly.
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      # `.cargo/config.toml` puts the build directory at `Target` (capital), not
      # the default `target`, so that is the path worth caching.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            Target/
          key: cargo-check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-check-${{ runner.os }}-

      # `--locked` because the release builds with it: a lock file that no longer
      # matches the manifests has to fail on the push, not on the tag.
      - name: cargo check
        run: cargo check --workspace --locked

  Clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (stable, clippy)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            Target/
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-clippy-${{ runner.os }}-

      # `--all-targets` on purpose: the differential suites under `Crate/*/Test/`
      # are where the fakes live, and a lint that only sees the libraries would
      # let them rot. `-D warnings` because a warning nobody has to fix is a
      # warning everybody learns to ignore.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  Format:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nightly here and nowhere else, because `rustfmt.toml` at the repository
      # root is the house style and most of it is nightly-only: `hard_tabs`,
      # `space_after_colon`, `imports_granularity`, `group_imports`,
      # `format_strings` and thirty-five more - 40 options in all, which is
      # `cargo +stable fmt --all -- --check 2>&1 | grep "can't set"` counted by
      # option name. Stable rustfmt does not fail on them - it warns
      # `unstable features are only available in nightly` and formats with the
      # defaults instead, which on this tree means 798 diffs (counted from
      # `grep -c '^Diff in'`) and a red gate on every push. Pinned to a date
      # rather than `nightly` for the other half of the problem: rustfmt's
      # output moves between nightlies, so a floating pin goes red on an
      # unrelated push the day the formatter changes its mind.
      - name: Setup Rust (nightly, pinned to the formatter)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-10-17
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  Test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            Target/
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      # No browser is launched: every port in these suites is a fake, which is
      # what makes the differential run reproducible on a bare runner.
      - name: cargo test
        run: cargo test --workspace --locked

  Skills:
    name: skill corpus gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            Target/
          key: cargo-skills-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-skills-${{ runner.os }}-

      # The gate command itself carries no `--locked`, so the lock file is
      # checked here instead: `cargo run` would otherwise rewrite a stale
      # `Cargo.lock` in the workspace and report success.
      - name: cargo fetch (lock file must be current)
        run: cargo fetch --locked

      # `agentic skills` reports findings and exits 0 - the corpus is data, not
      # an assertion - so the gate reads the sentence rather than the status
      # code. The pattern carries both commas on purpose: `0 finding(s)` alone
      # would also match `10 finding(s)`, which is the case this gate exists
      # to catch.
      - name: Skill corpus gate
        run: |
          set -euo pipefail
          Output="$(cargo run -p agentic --release -- skills Documentation/Skill)"
          printf '%s\n' "${Output}"
          if ! printf '%s\n' "${Output}" | grep -qF ', 0 finding(s),'; then
            echo "::error::the skill corpus under Documentation/Skill has findings"
            exit 1
          fi
